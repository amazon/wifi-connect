---
name: build wifi-connect UI artifact
description: Build the UI tarball used by GitHub releases.

inputs:
  node-version:
    description: Node.js version to use for the UI build.
    required: false
    default: "20.x"
  upload-artifact:
    description: Set to true to upload the built tarball as a workflow artifact.
    required: false
    default: "false"
  artifact-name:
    description: Name to use when uploading the workflow artifact.
    required: false
    default: "wifi-connect-ui"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: |
        cd ./ui
        if [ -e package-lock.json ]; then
          npm ci
        else
          npm i
        fi

    - name: Build wifi-connect-ui
      shell: bash
      run: |
        cd ./ui
        npm run build
        tar --auto-compress -cvf wifi-connect-ui.tar.gz -C build .

    - name: Upload artifact
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ./ui/wifi-connect-ui.tar.gz
        retention-days: 7