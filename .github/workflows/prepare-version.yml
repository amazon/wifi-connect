name: Prepare Version

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch for the release PR. Defaults to the ref this workflow runs against.
        required: false
        default: ""
  push:
    branches-ignore: [main, master]
    paths:
      - .github/workflows/prepare-version.yml
      - scripts/run-balena-versionist.sh
      - Cargo.toml
      - CHANGELOG.md
      - .versionbot/CHANGELOG.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
      pull-request-url: ${{ steps.create_pr.outputs.pull-request-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch || github.ref_name }}

      - name: Describe run mode
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Running in release mode: this run may create or update a release PR."
          else
            echo "Running in dry-run mode from a branch push: this run will not create or update a PR."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install versioning tools
        run: npm install -g balena-versionist@~0.15.0 versionist@^8.1.0

      - name: Run balena-versionist
        id: version
        run: |
          version="$(bash scripts/run-balena-versionist.sh)"
          {
            echo "version=${version}"
            echo "tag=v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Detect versioning changes
        id: changes
        run: |
          if [[ -z "$(git status --short)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No versioning changes were generated."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release PR body
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          {
            echo "This PR was generated by the version preparation workflow."
            echo
            echo "Proposed tag: ${{ steps.version.outputs.tag }}"
            echo
            echo "Manual follow-up after merge:"
            echo "- create the tag ${{ steps.version.outputs.tag }}"
            echo "- create or update the matching GitHub release"
            echo "- wait for the tag-triggered release workflow to attach the assets"
          } > "$RUNNER_TEMP/release-pr-body.md"

      - name: Capture generated patch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git diff --binary > "$RUNNER_TEMP/prepare-version.patch"
          git diff --stat > "$RUNNER_TEMP/prepare-version.stat"

      - name: Upload dry-run patch
        if: github.event_name == 'push' && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prepare-version-dry-run-${{ github.sha }}
          path: |
            ${{ runner.temp }}/prepare-version.patch
            ${{ runner.temp }}/prepare-version.stat
          retention-days: 7

      - name: Summarize dry-run output
        if: github.event_name == 'push' && steps.changes.outputs.has_changes == 'true'
        run: |
          {
            echo "Dry-run only: no PR was created."
            echo
            echo "Proposed tag: ${{ steps.version.outputs.tag }}"
            echo
            echo "Generated file changes:"
            cat "$RUNNER_TEMP/prepare-version.stat"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update release PR
        id: create_pr
        if: github.event_name == 'workflow_dispatch' && steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Prepare ${{ steps.version.outputs.tag }}
          title: Prepare ${{ steps.version.outputs.tag }}
          body-path: ${{ runner.temp }}/release-pr-body.md
          branch: release/${{ steps.version.outputs.tag }}
          base: ${{ inputs.base_branch || github.ref_name }}
          delete-branch: true

      - name: Report no-op run
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "Version preparation produced no file changes."