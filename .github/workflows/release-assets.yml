name: Release Assets

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo version
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"

          if [[ -z "${version}" ]]; then
            echo "::error::Failed to determine the Cargo package version."
            exit 1
          fi

          if [[ "${tag}" != "v${version}" ]]; then
            echo "::error::Tag ${tag} does not match Cargo.toml version v${version}."
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: bash scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release-notes.md"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 7

  rust-assets:
    name: Rust asset (${{ matrix.target }})
    needs: metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Build release tarball
        run: bash scripts/build-rust-release-asset.sh "${{ matrix.target }}"

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: wifi-connect-${{ matrix.target }}.tar.gz
          retention-days: 7

  ui-asset:
    name: UI asset
    needs: metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build UI tarball
        uses: ./.github/actions/publish
        with:
          upload-artifact: 'true'
          artifact-name: release-ui

  publish-existing-release:
    name: Publish to existing release
    needs:
      - metadata
      - rust-assets
      - ui-asset
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release
          pattern: release-*
          merge-multiple: true

      - name: Upload assets if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob

          mapfile -t asset_files < <(find "$RUNNER_TEMP/release" -maxdepth 1 -type f -name '*.tar.gz' | sort)
          notes_file="$RUNNER_TEMP/release/release-notes.md"

          if [[ ${#asset_files[@]} -eq 0 ]]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          {
            echo "Generated assets:"
            printf -- '- %s\n' "${asset_files[@]##*/}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "$notes_file" ]]; then
            {
              echo
              echo "Release notes preview:"
              echo
              cat "$notes_file"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${asset_files[@]}" --clobber

            if [[ -f "$notes_file" ]]; then
              gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes_file"
            fi
          else
            echo "::warning::GitHub release ${GITHUB_REF_NAME} does not exist. Assets remain attached to this workflow run."
            {
              echo
              echo "Manual follow-up:"
              echo "- create a GitHub release named ${GITHUB_REF_NAME}"
              echo "- rerun this workflow or upload the assets from this run manually"
            } >> "$GITHUB_STEP_SUMMARY"
          fi