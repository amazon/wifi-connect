name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-format:
    name: Rust format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.76
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  rust-checks:
    name: Rust checks (${{ matrix.target }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.76
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install cross
        run: cargo install cross --locked

      - name: Configure cross for act
        run: |
          if [[ "${ACT:-}" == "true" ]]; then
            container_id="$(grep -oE '/var/lib/docker/containers/[0-9a-f]{64}' /proc/self/mountinfo | head -n 1 | sed 's#.*/##')"

            echo "CROSS_CONTAINER_IN_CONTAINER=true" >> "$GITHUB_ENV"

            if [[ -n "${container_id}" ]]; then
              echo "HOSTNAME=${container_id}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Lint with clippy
        run: cross clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Run tests
        run: cross test --all-features --locked --target ${{ matrix.target }}

      - name: Run examples and benchmarks
        run: cross test --examples --benches --all-features --locked --target ${{ matrix.target }}

  ui-build:
    name: UI build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build UI artifact
        uses: ./.github/actions/publish
        with:
          upload-artifact: 'false'